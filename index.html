
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Glow - Inventario</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f9;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 11px;
      border: 1px solid #ccd1da;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input[readonly] {
      background: #f6f7f9;
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2259c5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .boton-secundario {
      background: #525c6b;
    }

    #lector {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
    }

    #estado {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      background: #eef2f8;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .tarjeta-producto {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #e0e4eb;
      border-radius: 12px;
    }

    .imagen-contenedor {
      display: none;
      margin-bottom: 15px;
      text-align: center;
    }

    #imagenProducto {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 8px;
    }

    .nota {
      margin-top: 18px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>📦 Sistema Glow</h1>
    <p class="subtitulo">Consulta de productos e inventario</p>

    <button id="iniciar" type="button" onclick="iniciarEscaner()">
      📷 Abrir cámara
    </button>

    <button
      id="detener"
      class="boton-secundario"
      type="button"
      onclick="detenerEscaner()"
      hidden
    >
      Detener cámara
    </button>

    <div id="lector"></div>

    <div id="estado" role="status" aria-live="polite">
      Escanea un código o escríbelo manualmente.
    </div>

    <label for="codigo">Código de barras</label>
    <input
      id="codigo"
      type="text"
      placeholder="Escanea o escribe el código"
      autocomplete="off"
    >

    <button id="buscar" type="button" onclick="buscarProducto()">
      🔎 Buscar producto
    </button>

    <section id="tarjetaProducto" class="tarjeta-producto">
      <div id="contenedorImagen" class="imagen-contenedor">
        <img
          id="imagenProducto"
          alt="Imagen del producto"
        >
      </div>

      <label for="producto">Nombre del producto</label>
      <input id="producto" type="text" readonly>

      <label for="precio">Precio</label>
      <input id="precio" type="text" readonly>

      <label for="categoria">Categoría</label>
      <input id="categoria" type="text" readonly>

      <label for="idProducto">ID del producto</label>
      <input id="idProducto" type="text" readonly>

      
      <div id="panelInventario" style="
        margin-top: 16px;
        padding: 15px;
        border: 1px solid #e0e4eb;
        border-radius: 12px;
        background: #f6f8fc;
      ">
        <h3 style="margin-top: 0;">📦 Existencias</h3>
      
        <label for="stock">Stock disponible</label>
        <input id="stock" type="text" readonly>
      
        <label for="stockMinimo">Stock mínimo</label>
        <input id="stockMinimo" type="text" readonly>
      
        <p id="alertaStock" role="status" style="font-weight: bold;"></p>
      </div>


      <label for="cantidad">Cantidad</label>
      <input
        id="cantidad"
        type="number"
        min="1"
        step="1"
        value="1"
      >

      <label for="ubicacion">Ubicación (opcional)</label>
      <input
        id="ubicacion"
        type="text"
        placeholder="Ej.: Bodega, estante A1"
      >
    </section>

    <p class="nota">
      La consulta obtiene los datos de Google Sheets.
      Por ahora, los campos de cantidad y ubicación son informativos:
      todavía no registran movimientos ni modifican las existencias.
    </p>
  </main>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzrxb4r6eMwEd6t0bs3VEpsy8CE6SYOT_v2pzi7-kBOVZxZF6Z-YWkHKNSzf3ronKuw/exec";

    let escaner = null;
    let escanerActivo = false;
    let codigoProcesado = false;

    let consultaPendiente = null;
    let temporizadorConsulta = null;
    let numeroConsulta = 0;

    function mostrarEstado(mensaje) {
      document.getElementById("estado").textContent = mensaje;
    }

    function limpiarResultado() {
      document.getElementById("tarjetaProducto").style.display = "none";

      document.getElementById("producto").value = "";
      document.getElementById("precio").value = "";
      document.getElementById("categoria").value = "";
      document.getElementById("idProducto").value = "";
      document.getElementById("stock").value = "";
      document.getElementById("stockMinimo").value = "";
      document.getElementById("alertaStock").textContent = "";


      document.getElementById("imagenProducto").removeAttribute("src");
      document.getElementById("contenedorImagen").style.display = "none";
    }

    function cancelarConsultaAnterior() {
      numeroConsulta++;

      if (temporizadorConsulta) {
        clearTimeout(temporizadorConsulta);
        temporizadorConsulta = null;
      }

      if (consultaPendiente) {
        consultaPendiente.remove();
        consultaPendiente = null;
      }
    }

    function buscarProducto() {
      const codigo = document.getElementById("codigo").value.trim();
      const boton = document.getElementById("buscar");

      if (!codigo) {
        mostrarEstado("Escribe o escanea un código de barras.");
        return;
      }

      cancelarConsultaAnterior();

      const consultaActual = numeroConsulta;
      const callback = "recibirProducto_" + consultaActual;
      const script = document.createElement("script");

      limpiarResultado();
      boton.disabled = true;
      mostrarEstado("Buscando producto...");

      consultaPendiente = script;

      window[callback] = function(resultado) {
        if (consultaActual !== numeroConsulta) return;

        if (temporizadorConsulta) {
          clearTimeout(temporizadorConsulta);
          temporizadorConsulta = null;
        }

        consultaPendiente = null;
        script.remove();
        delete window[callback];

        boton.disabled = false;

        if (!resultado || !resultado.encontrado) {
          mostrarEstado(
            resultado && resultado.mensaje
              ? resultado.mensaje
              : "No se encontró el producto."
          );
          return;
        }

        document.getElementById("codigo").value =
          resultado.codigoBarras || codigo;

        document.getElementById("producto").value =
          resultado.nombre || "";

        document.getElementById("precio").value =
          resultado.precio || "";

        document.getElementById("categoria").value =
          resultado.categoria || "";

        document.getElementById("idProducto").value =
          resultado.id || "";

        
        const campoStock = document.getElementById("stock");
        const campoMinimo = document.getElementById("stockMinimo");
        const alertaStock = document.getElementById("alertaStock");
        
        if (resultado.inventarioEncontrado) {
          campoStock.value = resultado.stock;
          campoMinimo.value = resultado.stockMinimo;
        
          const stock = Number(resultado.stock);
          const minimo = Number(resultado.stockMinimo);
        
          if (resultado.stock === "" || resultado.stockMinimo === "" ||
              !Number.isFinite(stock) || !Number.isFinite(minimo)) {
            alertaStock.textContent =
              "⚠️ Revisa los valores de stock en Google Sheets.";
            alertaStock.style.color = "#9a6700";
          } else if (stock <= 0) {
            alertaStock.textContent = "🔴 Producto agotado";
            alertaStock.style.color = "#c62828";
          } else if (stock <= minimo) {
            alertaStock.textContent = "⚠️ Stock bajo";
            alertaStock.style.color = "#b26a00";
          } else {
            alertaStock.textContent = "✅ Existencias suficientes";
            alertaStock.style.color = "#16803c";
          }
        } else {
          campoStock.value = "Sin registro";
          campoMinimo.value = "Sin registro";
          alertaStock.textContent =
            "⚠️ Este producto no tiene un registro en Inventario.";
          alertaStock.style.color = "#9a6700";
        }


        document.getElementById("tarjetaProducto").style.display = "block";

        const imagen = document.getElementById("imagenProducto");
        const contenedorImagen = document.getElementById("contenedorImagen");
        const urlImagen = String(resultado.imagen || "").trim();

        if (/^https:\/\/\S+$/i.test(urlImagen)) {
          imagen.onload = function() {
            contenedorImagen.style.display = "block";
          };

          imagen.onerror = function() {
            imagen.removeAttribute("src");
            contenedorImagen.style.display = "none";
          };

          imagen.src = urlImagen;
        } else {
          imagen.removeAttribute("src");
          contenedorImagen.style.display = "none";
        }

        mostrarEstado("✅ Producto encontrado: " + resultado.nombre);
      };

      script.onerror = function() {
        if (consultaActual !== numeroConsulta) return;

        if (temporizadorConsulta) {
          clearTimeout(temporizadorConsulta);
          temporizadorConsulta = null;
        }

        consultaPendiente = null;
        script.remove();
        delete window[callback];

        boton.disabled = false;

        mostrarEstado(
          "No se pudo consultar el servidor. Revisa tu conexión e intenta nuevamente."
        );
      };

      script.src =
        URL_APPS_SCRIPT +
        "?codigo=" + encodeURIComponent(codigo) +
        "&callback=" + encodeURIComponent(callback) +
        "&t=" + Date.now();

      document.body.appendChild(script);

      temporizadorConsulta = setTimeout(function() {
        if (consultaActual !== numeroConsulta) return;

        numeroConsulta++;
        consultaPendiente = null;

        script.remove();
        delete window[callback];

        temporizadorConsulta = null;
        boton.disabled = false;

        mostrarEstado("La consulta tardó demasiado. Intenta nuevamente.");
      }, 20000);
    }

    async function iniciarEscaner() {
      if (escanerActivo) return;

      if (typeof Html5Qrcode === "undefined") {
        mostrarEstado(
          "No se pudo cargar el lector. Comprueba tu conexión a Internet."
        );
        return;
      }

      try {
        if (!escaner) {
          escaner = new Html5Qrcode("lector");
        }

        codigoProcesado = false;
        mostrarEstado("Solicitando acceso a la cámara...");

        await escaner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.ITF
            ]
          },
          async function(texto) {
            if (!escanerActivo || codigoProcesado) return;

            codigoProcesado = true;
            document.getElementById("codigo").value = texto;

            mostrarEstado("Código detectado. Buscando producto...");

            await detenerEscaner();
            buscarProducto();
          },
          function() {
            // Ignora los fotogramas donde no se detecta un código.
          }
        );

        escanerActivo = true;

        document.getElementById("iniciar").hidden = true;
        document.getElementById("detener").hidden = false;

        mostrarEstado("Cámara activa. Coloca el código frente a ella.");

      } catch (error) {
        escanerActivo = false;

        mostrarEstado(
          "No se pudo abrir la cámara. Revisa los permisos del navegador."
        );
      }
    }

    async function detenerEscaner() {
      if (!escaner) return;

      if (escanerActivo) {
        try {
          await escaner.stop();
        } catch (error) {
          // Puede que el lector ya se haya detenido.
        }
      }

      escanerActivo = false;

      document.getElementById("iniciar").hidden = false;
      document.getElementById("detener").hidden = true;

      try {
        await escaner.clear();
      } catch (error) {
        // No hace falta mostrar un error si ya se limpió el lector.
      }
    }

    document.getElementById("codigo").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        buscarProducto();
      }
    });
  </script>
</body>
</html>
