
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Inventario</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #166534;
            margin-top: 0;
        }

        .descripcion {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .boton-escanear {
            background: #15803d;
            color: white;
        }

        .boton-detener {
            background: #dc2626;
            color: white;
        }

        .boton-limpiar {
            background: #e2e8f0;
            color: #1e293b;
        }

        #lector {
            width: 100%;
            margin-top: 20px;
        }

        #estado {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #f1f5f9;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .nota {
            font-size: 13px;
            color: #64748b;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="contenedor">

        <h1>📦 Mi Inventario</h1>

        <p class="descripcion">
            Escanea un código o busca un producto
        </p>

        <button
            class="boton-escanear"
            id="iniciar"
            type="button"
            onclick="iniciarEscaner()">
            📷 Abrir cámara
        </button>

        <div id="lector"></div>

        <div id="estado" role="status" aria-live="polite">
            Pulsa «Abrir cámara» o escribe un código de barras.
        </div>

        <label for="codigo">Código de barras</label>
        <input
            type="text"
            id="codigo"
            placeholder="Escanea o escribe el código"
            autocomplete="off">

        <button
            class="boton-escanear"
            id="buscar"
            type="button"
            onclick="buscarProducto()">
            🔎 Buscar producto
        </button>

        <label for="producto">Nombre del producto</label>
        <input
            type="text"
            id="producto"
            placeholder="Nombre del producto"
            readonly>

        <label for="precio">Precio</label>
        <input
            type="text"
            id="precio"
            placeholder="Precio del producto"
            readonly>

        <label for="categoria">Categoría</label>
        <input
            type="text"
            id="categoria"
            placeholder="Categoría del producto"
            readonly>

        <label for="cantidad">Cantidad</label>
        <input
            type="number"
            id="cantidad"
            min="1"
            step="1"
            value="1">

        <label for="ubicacion">Ubicación</label>
        <input
            type="text"
            id="ubicacion"
            placeholder="Ej. Bodega A">

        <button
            class="boton-limpiar"
            type="button"
            onclick="limpiarCampos()">
            Limpiar campos
        </button>

        <p class="nota">
            Consulta conectada con Google Sheets.
            Las entradas y salidas de inventario todavía
            no se registran desde esta página.
        </p>

    </main>

    <script>
        // URL de tu aplicación de Google Apps Script.
        const URL_APPS_SCRIPT =
            "https://script.google.com/macros/s/AKfycbzrxb4r6eMwEd6t0bs3VEpsy8CE6SYOT_v2pzi7-kBOVZxZF6Z-YWkHKNSzf3ronKuw/exec";

        let escaner = null;
        let escanerActivo = false;
        let consultaPendiente = null;
        let temporizadorConsulta = null;
        let numeroConsulta = 0;

        function mostrarEstado(mensaje) {
            document.getElementById("estado").textContent = mensaje;
        }

        async function iniciarEscaner() {
            const boton = document.getElementById("iniciar");

            if (escanerActivo) {
                mostrarEstado("La cámara ya está funcionando.");
                return;
            }

            if (typeof Html5Qrcode === "undefined") {
                mostrarEstado(
                    "No se pudo cargar el lector. Revisa tu conexión a Internet."
                );
                return;
            }

            boton.disabled = true;
            mostrarEstado("Solicitando acceso a la cámara...");

            try {
                escaner = new Html5Qrcode("lector");

                await escaner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 280, height: 120 },
                        aspectRatio: 1.5
                    },
                    (texto) => {
                        // Evita procesar varias veces el mismo escaneo.
                        if (!escanerActivo) return;

                        document.getElementById("codigo").value = texto;
                        mostrarEstado("Código detectado. Buscando producto...");

                        detenerEscaner();
                        buscarProducto();
                    },
                    () => {
                        // Ignora los fotogramas sin códigos detectados.
                    }
                );

                escanerActivo = true;
                mostrarEstado(
                    "Cámara activa. Enfoca un código de barras."
                );
                boton.textContent = "📷 Cámara abierta";

            } catch (error) {
                mostrarEstado(
                    "No se pudo abrir la cámara. Comprueba los permisos " +
                    "del navegador y que la página use HTTPS."
                );

                if (escaner) {
                    try {
                        await escaner.clear();
                    } catch (_) {}
                    escaner = null;
                }

            } finally {
                boton.disabled = false;
            }
        }

        async function detenerEscaner() {
            if (!escaner) return;

            try {
                if (escanerActivo) {
                    await escaner.stop();
                    escanerActivo = false;
                }

                await escaner.clear();

                document.getElementById("iniciar").textContent =
                    "📷 Abrir cámara";

                escaner = null;

            } catch (error) {
                console.error("Error al detener el escáner:", error);
            }
        }

        function limpiarResultado() {
            document.getElementById("producto").value = "";
            document.getElementById("precio").value = "";
            document.getElementById("categoria").value = "";
        }

        function buscarProducto() {
            const codigo = document.getElementById("codigo").value.trim();
            const boton = document.getElementById("buscar");

            if (!codigo) {
                mostrarEstado("Escribe o escanea un código de barras.");
                return;
            }

            // Invalida cualquier consulta anterior.
            numeroConsulta++;
            const consultaActual = numeroConsulta;

            if (consultaPendiente) {
                consultaPendiente.remove();
                consultaPendiente = null;
            }

            if (temporizadorConsulta) {
                clearTimeout(temporizadorConsulta);
                temporizadorConsulta = null;
            }

            limpiarResultado();
            boton.disabled = true;
            mostrarEstado("Buscando producto...");

            const callback = "recibirProducto_" + consultaActual;
            const script = document.createElement("script");

            consultaPendiente = script;

            // El callback es generado por el propio programa.
            window[callback] = function(resultado) {
                if (consultaActual !== numeroConsulta) return;

                if (temporizadorConsulta) {
                    clearTimeout(temporizadorConsulta);
                    temporizadorConsulta = null;
                }

                if (consultaPendiente === script) {
                    consultaPendiente = null;
                }

                script.remove();
                delete window[callback];
                boton.disabled = false;

                if (resultado && resultado.encontrado) {
                    document.getElementById("codigo").value =
                        resultado.codigoBarras || codigo;
                    document.getElementById("producto").value =
                        resultado.nombre || "";
                    document.getElementById("precio").value =
                        resultado.precio || "";
                    document.getElementById("categoria").value =
                        resultado.categoria || "";

                    mostrarEstado(
                        "✅ Producto encontrado: " + resultado.nombre
                    );

                } else {
                    mostrarEstado(
                        resultado && resultado.mensaje
                            ? resultado.mensaje
                            : "No se encontró el producto."
                    );
                }
            };

            script.onerror = function() {
                if (consultaActual !== numeroConsulta) return;

                if (temporizadorConsulta) {
                    clearTimeout(temporizadorConsulta);
                    temporizadorConsulta = null;
                }

                consultaPendiente = null;
                script.remove();
                delete window[callback];
                boton.disabled = false;

                mostrarEstado(
                    "No se pudo consultar el servidor. " +
                    "Comprueba que Apps Script esté implementado " +
                    "con la versión actual."
                );
            };

            script.src = URL_APPS_SCRIPT
                + "?codigo=" + encodeURIComponent(codigo)
                + "&callback=" + encodeURIComponent(callback)
                + "&t=" + Date.now();

            document.body.appendChild(script);

            // Informa si el servidor no responde.
            temporizadorConsulta = setTimeout(() => {
                if (consultaActual !== numeroConsulta) return;

                numeroConsulta++;
                consultaPendiente = null;
                script.remove();
                delete window[callback];
                boton.disabled = false;

                mostrarEstado(
                    "La consulta tardó demasiado. Intenta nuevamente."
                );
            }, 20000);
        }

        function limpiarCampos() {
            numeroConsulta++;

            if (consultaPendiente) {
                consultaPendiente.remove();
                consultaPendiente = null;
            }

            if (temporizadorConsulta) {
                clearTimeout(temporizadorConsulta);
                temporizadorConsulta = null;
            }

            document.getElementById("codigo").value = "";
            document.getElementById("cantidad").value = "1";
            document.getElementById("ubicacion").value = "";

            limpiarResultado();

            document.getElementById("buscar").disabled = false;

            mostrarEstado(
                "Campos limpiados. Puedes buscar otro producto."
            );
        }

        // Permite buscar pulsando Enter en el campo de código.
        document.getElementById("codigo").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    buscarProducto();
                }
            }
        );

        window.addEventListener("pagehide", () => {
            if (escaner && escanerActivo) {
                escaner.stop().catch(() => {});
            }
        });
    </script>
</body>
</html>
